spring.application.name=RelearnSpringBoot
server.port=8081
# setting postgres with spring
spring.datasource.url=jdbc:postgresql://localhost:5432/pgDataLearn
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA & Hibernate cho Postgres dialect spring 6 auto choose dialect optimize with db, don't choose it here
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# setting MySql with spring
#spring.datasource.url=jdbc:mysql://localhost:3306/myDataLearn?useSSL=false&serverTimezone=UTC
#spring.datasource.username=root
#spring.datasource.password=123456
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#
## JPA & Hibernate cho MySQL
##spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# cho phep flyway tu dong chay migration khi start app
spring.flyway.enabled=true

# chon lua schema de xu dung flyway de chay script
spring.flyway.default-schema=my_schema

#che do baseline
#False: mac dinh: se bao loi neu db da co du lieu nhung chua co lich su Flyway
#True: se tu dong tao bang lich su va coi db hien tai la phien ban goc v1 neu gap db cu
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

#duong dan toi thu muc chua cac file sql migration
spring.flyway.locations=classpath:db/migration


